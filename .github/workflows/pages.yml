name: Build e publicação no GitHub Pages

# ─────────────────────────────────────────────────────────────────────────────
# COMO ESTE WORKFLOW SE COMPORTA
#
# A cada push na main o site é COMPILADO, mas não vai ao ar sozinho: a etapa de
# publicação espera aprovação manual. Assim você descobre imediatamente se algo
# quebrou, sem que o erro chegue ao público.
#
# O job `build` gera o site e escreve um resumo na aba Actions — número de
# páginas, tamanho, e o resultado da verificação de links. O job `deploy` fica
# em "Waiting" até alguém aprovar.
#
# CONFIGURAÇÃO NECESSÁRIA, uma única vez:
#   1. Settings → Pages → Source → "GitHub Actions"
#   2. Settings → Environments → github-pages → Required reviewers
#      → marque a caixa e adicione a si mesmo → Save protection rules
#
# Sem o passo 2 o site publica direto, como antes.
#
# Por que um workflow próprio em vez do build clássico do Pages: aquele usa
# Jekyll 3.10 e ignora o Gemfile, enquanto o desenvolvimento local usa Jekyll 4.
# Assim a produção usa exatamente as gems do repositório, e a lista fechada de
# plugins do Pages deixa de limitar o projeto.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite disparar manualmente na aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Evita duas publicações simultâneas; não cancela a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar e verificar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true   # roda bundle install e cacheia as gems

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build do Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Verificar links e HTML
        id: proofer
        continue-on-error: true
        run: |
          gem install html-proofer -N
          htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --ignore-empty-alt false \
            2>&1 | tee /tmp/proofer.log

      # O resumo aparece na página do run e é o que você lê antes de aprovar.
      - name: Resumo do build
        if: always()
        run: |
          {
            echo "## Site compilado"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Páginas HTML | $(find _site -name '*.html' | wc -l) |"
            echo "| Tamanho | $(du -sh _site | cut -f1) |"
            echo "| Seminários | $(find _site -path '*seminars*' -name '*.html' | wc -l) |"
            echo "| Verificação de links | ${{ steps.proofer.outcome }} |"
            echo
            if [ "${{ steps.proofer.outcome }}" != "success" ]; then
              echo "<details><summary>Problemas encontrados pelo html-proofer</summary>"
              echo
              echo '```'
              tail -40 /tmp/proofer.log 2>/dev/null || echo "(sem log)"
              echo '```'
              echo
              echo "</details>"
              echo
            fi
            echo "Revise e aprove na etapa **Publicar** para o site ir ao ar."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    # A proteção do environment `github-pages` é o que segura este job até a
    # aprovação. Ela é configurada na interface do GitHub, não aqui.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
