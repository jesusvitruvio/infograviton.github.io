# Todas as pessoas que passaram pelo grupo — atuais e egressas.
#
# ────────────────────────────────────────────────────────────────────────────
# PRINCÍPIO: um nome nunca é apagado deste arquivo.
#
# Em vez de dizer "fulano é doutorando", cada pessoa tem uma lista de
# passagens datadas. O site deduz o resto: quem ainda está no grupo, há quanto
# tempo, quando defendeu. Quando um vínculo termina, você acrescenta `end:` — a
# pessoa migra sozinha para a lista de egressos, sem perder o registro.
# ────────────────────────────────────────────────────────────────────────────
#
# Campos da pessoa:
#   slug         identificador; foto esperada em assets/img/members/<slug>.jpg
#                (sem foto, o site mostra as iniciais — nada quebra)
#   name         nome completo
#   lattes,      identificadores opcionais; viram links
#   orcid,
#   website
#   blurb        uma ou duas frases; opcional, usado só para quem está no grupo
#
# Campos de cada passagem, em `roles:`
#   kind         pi | postdoc | phd | msc | undergrad   (rótulos em strings.yml)
#   start        'AAAA' ou 'AAAA-MM' — sempre entre aspas, é texto
#   end          idem; a AUSÊNCIA de `end` é o que marca vínculo em curso
#   institution  só quando difere da UFABC
#   funding      FAPESP | CAPES | CNPq | UFABC
#   note         observação curta (coorientação, por exemplo)
#
# Fonte: currículo Lattes de André G. S. Landulfo, seção Orientações
# (consultado em 29/07/2026), cruzado com os Lattes individuais quando havia.

# ─────────────────────────── coordenação ───────────────────────────

