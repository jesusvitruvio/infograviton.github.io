# Membros do grupo. Fonte única de dados: as páginas em inglês e português
# são geradas a partir daqui.
#
# Campos:
#   slug      identificador; a foto esperada é assets/img/members/<slug>.jpg
#             (se ausente, o site mostra as iniciais automaticamente)
#   role      pi | postdoc | phd | masters   (rótulos em _data/i18n.yml)
#   blurb_en  uma ou duas frases sobre a pesquisa, em inglês
#   blurb_pt  o mesmo em português
#   funding   FAPESP | CAPES | CNPq | UFABC

- slug: landulfo
  name: André G. S. Landulfo
  role: pi
  institution: UFABC
  lattes: '2705752886744456'
  blurb_en: >-
    General relativity, quantum field theory in curved spacetimes, and quantum
    information at its interface with relativity. PhD from IFT/UNESP under
    George Matsas, postdoc at IFSC-USP.
  blurb_pt: >-
    Relatividade geral, teoria quântica de campos em espaços-tempos curvos e
    informação quântica na interface com a relatividade. Doutorado no IFT/UNESP
    sob orientação de George Matsas, pós-doutorado no IFSC-USP.

- slug: moreira
  name: Thiago Henrique Moreira
  role: postdoc
  institution: UFABC
  lattes: '4184415188926254'
  orcid: 0000-0001-7093-0287
  funding: FAPESP
  blurb_en: >-
    Decoherence and entropy production due to quantum fluctuations of spacetime.
    PhD from UFG with a research stay at the International Centre for Theory of
    Quantum Technologies, Gdansk.
  blurb_pt: >-
    Decoerência e produção de entropia devidas a flutuações quânticas do
    espaço-tempo. Doutorado pela UFG, com período sanduíche no International
    Centre for Theory of Quantum Technologies, em Gdansk.

- slug: alves
  name: Níckolas de Aguiar Alves
  role: phd
  institution: UFABC
  lattes: '4933609438452718'
  orcid: 0000-0002-0309-735X
  website: https://aguiaralves.com
  funding: FAPESP
  blurb_en: >-
    Infrared behaviour of gravity: asymptotic symmetries, the Bondi–Metzner–Sachs
    group, memory effects, and their role in quantum field theory on curved
    spacetimes.
  blurb_pt: >-
    Comportamento infravermelho da gravidade: simetrias assintóticas, grupo de
    Bondi–Metzner–Sachs, efeitos de memória e seu papel na teoria quântica de
    campos em espaços-tempos curvos.

- slug: oliveira
  name: Eduardo Amâncio Barbosa Oliveira
  role: phd
  institution: IFT/UNESP
  lattes: '8459917280924828'
  orcid: 0000-0002-4099-8878
  funding: FAPESP
  blurb_en: >-
    Foundations of quantum mechanics and relativistic quantum information,
    looking for low-energy traces of quantum gravity through relativistic
    quantum clocks. Visiting researcher at IQOQI Vienna.
  blurb_pt: >-
    Fundamentos da mecânica quântica e informação quântica relativística, em
