# Vocabulário controlado dos termos-chave usados nas publicações.
#
# ────────────────────────────────────────────────────────────────────────────
# POR QUE UM VOCABULÁRIO FECHADO
#
# Se cada pessoa escrever a palavra-chave à mão, "black hole", "black holes" e
# "Black Holes" viram três termos distintos e o mosaico se fragmenta até perder
# o sentido. Aqui os termos têm um `id` estável; as entradas de _bibliography
# referenciam o id, e a página exibe o `label`.
#
# Um id usado numa publicação e ausente daqui é ERRO — a grade o marca em
# vermelho, em vez de criar uma linha nova silenciosamente.
#
# Para renomear um termo na tela, mude só o `label`. Para renomear o id, é
# preciso atualizar as entradas que o usam.
# ────────────────────────────────────────────────────────────────────────────

