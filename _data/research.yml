# Linhas de pesquisa do grupo, exibidas em /research.

- id: qftcs
  title: Quantum field theory in curved spacetimes
  body: >-
    How quantum fields behave when spacetime is not flat. This is the framework
    behind the Unruh effect, Hawking radiation, and particle creation in
    expanding universes, and it is the common language of most of what we do.
    We are particularly interested in nonperturbative and algebraic approaches,
    in the construction of physically reasonable states, and in what quantum
    fields can tell us about the geometry they live on.

- id: rqi
  title: Relativistic quantum information
  body: >-
    What happens to information, entanglement, and measurement once relativity
    is taken seriously. We study communication channels between observers in
    curved spacetime, the operational meaning of measurements in quantum field
    theory, and the use of particle detectors and relativistic quantum clocks as
    probes of geometry.

- id: bhthermo
  title: Black hole thermodynamics and entropy bounds
  body: >-
    Black holes obey laws formally identical to those of thermodynamics, and the
    reason why remains open. We work on generalized entropy, quantum energy
    conditions, the Bousso bound and its quantum version, singularity theorems,
    and the information loss problem in evaporating spacetimes.

- id: infrared
  title: Infrared structure of gravity
  body: >-
    The symmetries of spacetime at null infinity — the Bondi–Metzner–Sachs group
    and its extensions — connect soft theorems, memory effects, and asymptotic
    charges into a single structure. We investigate these asymptotic symmetries,
    their generalization to cosmological horizons, and their consequences for
    quantum field theory.

- id: qgravity
  title: Low-energy quantum gravity
  body: >-
    Even without a complete theory of quantum gravity, the regime where gravity
    and quantum mechanics first meet is accessible. We pursue bottom-up
    approaches: gravitationally induced decoherence and entanglement, the
    quantum nature of the gravitational field in table-top settings, and what
    effective field theory can and cannot predict.
